<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Escape the Vikings, collect fruit and answer 30 Viking history questions."><title>Viking Chase · Evan’s Universe</title><link rel="stylesheet" href="style.css?v=1"></head><body><div id="viking-monk">
<div class="game-heading"><div><p class="eyebrow">THE HUNGRY MONK · YEAR 4 HISTORY</p><h1>Viking Chase</h1></div><span class="mark" aria-hidden="true">⚔️</span></div>
<div class="viz-row"><span id="vm-stats" class="viz-badge"></span><button id="vm-play" class="btn btn-primary">Play · arrow keys</button><button id="vm-full" class="btn">Full screen</button></div>
<div id="vm-notice" aria-live="polite">You: golden monk 🟡 · Enemies: bearded Vikings ⚔️ · Move: arrow keys</div>
<section id="vm-quiz" class="card" hidden><h3 id="vm-question"></h3><div id="vm-answers"></div><div id="vm-feedback" aria-live="polite"></div><button id="vm-continue" class="btn btn-primary" hidden>Back to the maze</button></section>
<canvas id="vm-canvas" width="1120" height="1240" role="img" aria-label="Classic maze. You are a round brown-robed monk, chased by four little Vikings. Eat dots and 30 fruits."></canvas>
<div class="vm-directions viz-row"><button class="btn" data-dir="up" aria-label="Move up">↑</button><button class="btn" data-dir="left" aria-label="Move left">←</button><button class="btn" data-dir="down" aria-label="Move down">↓</button><button class="btn" data-dir="right" aria-label="Move right">→</button></div>
</div>
<script src="game.js?v=1"></script></body></html>
