<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Rush</title><link rel="stylesheet" href="style.css"></head><body><div id="game"></div><header><b>✦ WORD<span>RUSH</span></b><button id="sound">Audio on</button><button id="pause" hidden>Pause</button><button id="exit" hidden>Menu</button></header><main id="menu"><div class="menutop"><div><small class="eyebrow">PHONICS & SPELLING</small><h1>Word Rush</h1></div><span id="best"></span></div><div id="levels" role="group" aria-label="Spelling level"></div><div class="searchrow"><input id="search" type="search" placeholder="Find a sound or spelling" aria-label="Find a sound or spelling"><span id="topiccount"></span></div><div id="chaptergrid" aria-label="Spelling topics"></div><div class="selection"><div><strong id="selectedtitle"></strong><small id="selectedinfo"></small></div><label>Words <select id="roundlength"><option value="12">12</option><option value="20">20</option><option value="all">All</option></select></label><button class="primary" id="start">Run ▶</button></div><div class="help"><span>← → lanes & turns</span><span>Space / ↑ jump</span><span>P pause</span></div><a class="source" href="https://assets.publishing.service.gov.uk/media/5a7ccc06ed915d63cc65ce61/English_Appendix_1_-_Spelling.pdf" target="_blank" rel="noopener">England primary spelling reference</a></main><div id="hud" hidden><span id="score"></span><span id="chapterlabel"></span></div><div id="prompt" hidden><small id="instruction"></small><strong id="question"></strong><button id="hear" hidden aria-label="Hear word">Hear ♫</button><span id="hint"></span></div><div id="toast" role="status"></div><div id="result" hidden><section><small id="resultlabel"></small><h2 id="resulttitle"></h2><p id="resulttext"></p><div id="review"></div><button class="primary" id="retry">Retry</button><button id="home">Menu</button></section></div><nav id="mobile" hidden><button id="left" aria-label="Left lane or turn left">◀</button><button id="jump">JUMP</button><button id="right" aria-label="Right lane or turn right">▶</button></nav><script src="words.js"></script><script src="word-extras.js"></script><script type="module" src="game.js"></script></body></html>
