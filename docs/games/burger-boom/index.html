<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Choose a times table from 1–12. Grow bigger with every correct answer!"><title>Burger Boom · Evan’s Universe</title><link rel="stylesheet" href="style.css?v=2"></head><body><section id="bb-picker" aria-labelledby="bb-picker-title"><div class="picker-mark" aria-hidden="true">🍔</div><h1>Burger Boom</h1><h2 id="bb-picker-title">Choose your times table</h2><div id="bb-tables"></div><button id="bb-resume" class="btn" hidden>Continue</button></section><div id="burger-boom" hidden>
<div class="game-heading"><div><p class="eyebrow">THE TIMES TABLE DINER</p><h1>Burger Boom</h1></div><button id="bb-change" class="btn">Change table</button></div>
<div class="viz-row"><span id="bb-score" class="viz-badge">0 / 12 burgers</span><span id="bb-size">Skinny start</span></div>
<div id="bb-stage" role="img" aria-label="Cartoon man starts skinny and grows with each correct answer">
  <div id="bb-man">
    <div class="bb-feet"></div><div class="bb-arms"></div><div class="bb-body"><span>×4</span></div>
    <div class="bb-head"><div class="bb-hair"></div><div class="bb-eyes"><span>●</span><span>●</span></div><div id="bb-mouth"></div></div>
  </div>
</div>
<h3 id="bb-target"></h3>
<div id="bb-menu" aria-label="Choose one of four burgers"></div>
<div id="bb-message" aria-live="polite">Eat the right burger to grow. A wrong answer makes you go BOOM!</div>
<div class="viz-row"><button id="bb-next" class="btn btn-primary" hidden>Next burger</button><button id="bb-again" class="btn" hidden>Play again</button></div>
</div>
<script src="game.js?v=2"></script></body></html>
