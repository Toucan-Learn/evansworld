<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Evan’s Infinite Tower</title><link rel="stylesheet" href="style.css?v=3"><body><canvas id="game"></canvas><header><a id="brand">✦ INFINITE TOWER <small>EVAN’S ADVENTURE</small></a><div class="stats"><span id="height">0 m</span><span id="coins">● 0</span><button id="shop">Shop & pets <kbd>B</kbd></button><button id="map">Worlds</button><button id="controls" aria-label="Toggle touch controls" aria-pressed="false">Controls</button><button id="pause">Ⅱ</button></div></header><aside><span class="eyebrow" id="worldlabel"></span><h1 id="levelname"></h1><p id="objective">Follow the golden coins. The sky is only the beginning.</p><div class="progress"><i id="progress"></i></div><small id="stage"></small></aside><div id="toast"></div><footer><span>← → move &nbsp; ↑ / SPACE jump &nbsp; hold F fly &nbsp; ↓ glide</span><label>FLIGHT <i><b id="fuel"></b></i></label></footer><nav id="touch" aria-label="Touch game controls"><div class="touch-group"><button data-key="ArrowLeft" aria-label="Move left">←<small>LEFT</small></button><button data-key="ArrowRight" aria-label="Move right">→<small>RIGHT</small></button></div><div class="touch-group"><button data-key="ArrowDown" aria-label="Glide down">⌄<small>GLIDE</small></button><button data-key="Space" aria-label="Jump">↑<small>JUMP</small></button><button data-key="KeyF" aria-label="Fly" class="fly-button">✦<small>FLY</small></button></div></nav><div class="overlay" id="modal"><section id="panel"></section></div><script type="module" src="game.js?v=3"></script></body></html>
