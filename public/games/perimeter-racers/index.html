<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perimeter Racers</title><script>if(new URLSearchParams(location.search).get('embed')!=='1')location.replace(new URL('../../',location.href).href+'#perimeter-racers');</script><link rel="stylesheet" href="../maths-hunters/style.css"></head><body data-game="perimeter-racers"><main>
<header><div><p class="eyebrow">EVAN’S MATHS GAMES</p><h1>Perimeter Racers</h1></div><button id="restart" class="quiet" hidden>New game</button></header>
<section id="intro" class="intro"><div class="hero-icon" aria-hidden="true">🏃</div><h2>Perimeter Racers</h2><p>Run a lap. Add every side to find how far you ran.</p><button id="start">Let’s play</button></section>
<section id="play" class="layout" hidden><div class="scene" id="scene"></div><aside><p id="progress" class="progress"></p><h2 id="round-title"></h2><p id="prompt" class="prompt"></p><button id="action" class="action"></button><label id="grid-option" class="option" hidden><input id="grid" type="checkbox">Show square metres</label><form id="question" hidden><label for="answer" id="answer-label"></label><div class="answer-row"><input id="answer" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required aria-label="Your answer"><span id="unit" class="unit"></span></div><button class="submit" id="submit" type="submit"></button></form><p id="status" class="status" role="status" aria-live="polite"></p><button id="next" class="action" hidden>Next →</button><p id="hint" class="hint"></p></aside></section>
<section id="victory" class="victory" hidden><div class="hero-icon" aria-hidden="true">🏆</div><h2 id="win-title"></h2><p id="win-copy"></p><button id="again">Play again</button></section></main><script type="module" src="../maths-hunters/game.js"></script></body></html>
